<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trakeo · Liste d’attente</title>
<meta name="description" content="Trakeo ouvre progressivement. Rejoins la liste d’attente. · Trakeo opens step by step. Join the waitlist.">
<!-- Hand-written (not generated by the legal export). Talks to the
     Supabase access_* functions with the publishable key only. -->
<style>
:root { --bg: #0D1208; --card: #141C0D; --text: #EEF3E4; --muted: #B9C4AA; --lime: #D5F26C; --line: #26321B; --error: #FFB4A6; color-scheme: dark; }
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.6 Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; justify-content: space-between; align-items: center; }
.brand { font-weight: 800; font-size: 24px; color: var(--text); text-decoration: none; }
.lang { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 6px 14px; font: inherit; font-weight: 700; cursor: pointer; }
.pill { display: inline-block; background: var(--lime); color: var(--bg); font-weight: 800; letter-spacing: 2px; font-size: 13px; padding: 2px 12px; border-radius: 999px; margin-top: 32px; }
h1 { font-size: 30px; line-height: 1.2; margin: 16px 0 8px; }
p { color: var(--muted); margin: 0 0 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; margin-top: 24px; }
label { display: block; font-weight: 700; margin: 12px 0 6px; }
input[type=email], input[type=text] { width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
input:focus { outline: 2px solid var(--lime); outline-offset: 1px; }
.consent { display: flex; gap: 12px; align-items: flex-start; margin: 16px 0; font-size: 14px; color: var(--muted); font-weight: 400; }
.consent input { margin-top: 4px; width: 20px; height: 20px; accent-color: var(--lime); flex: none; }
button.primary { width: 100%; min-height: 54px; border: 0; border-radius: 16px; background: var(--lime); color: var(--bg); font: inherit; font-weight: 800; font-size: 17px; cursor: pointer; }
button.primary:disabled { opacity: .6; cursor: wait; }
button.secondary { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 14px; padding: 10px 16px; font: inherit; font-weight: 700; cursor: pointer; }
.error { color: var(--error); font-weight: 600; margin-top: 12px; }
.rank { font-size: 40px; font-weight: 800; color: var(--lime); line-height: 1.1; }
.link { display: flex; gap: 8px; margin-top: 12px; }
.link input { flex: 1; font-size: 14px; }
a { color: var(--lime); }
footer { margin-top: 32px; font-size: 13px; color: var(--muted); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <a class="brand" href="index.html">Trakeo</a>
    <button class="lang" id="lang" type="button">EN</button>
  </header>

  <span class="pill">BETA</span>
  <h1 data-t="title"></h1>
  <p data-t="intro"></p>

  <section class="card" id="join">
    <form id="form" novalidate>
      <label for="email" data-t="email"></label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="ref" data-t="ref"></label>
      <input id="ref" type="text" autocomplete="off" maxlength="12">
      <label class="consent"><input id="consent" type="checkbox"><span><span data-t="consent"></span> <a id="privacy" href="privacy.html" target="_blank" rel="noopener" data-t="privacy"></a></span></label>
      <button class="primary" id="submit" type="submit" data-t="submit"></button>
      <div class="error" id="error" role="alert" hidden></div>
    </form>
  </section>

  <section class="card" id="status" hidden>
    <div id="waiting">
      <p data-t="place"></p>
      <div class="rank" id="rank"></div>
      <p id="total"></p>
      <h2 data-t="moveUp"></h2>
      <p data-t="moveUpBody"></p>
      <p id="referrals"></p>
      <div class="link"><input id="mylink" type="text" readonly><button class="secondary" id="copy" type="button" data-t="copy"></button></div>
      <p style="margin-top:16px"><button class="secondary" id="share" type="button" data-t="share"></button></p>
    </div>
    <p id="invited" data-t="invited" hidden></p>
    <p style="margin-top:16px"><button class="secondary" id="leaveBtn" type="button" data-t="leave"></button></p>
  </section>

  <section class="card" id="left" hidden><p data-t="leftDone"></p></section>

  <footer><span data-t="footer"></span> · <a id="privacyFooter" href="privacy.html" data-t="privacy"></a></footer>
</main>
<script>
(() => {
  const SUPABASE_URL = 'https://xemrmfeitqcxtddpxcez.supabase.co';
  const PUBLISHABLE_KEY = 'sb_publishable_tSleKfPL5asuaipsfqpAWw_ha3KcAUc';
  const T = {
    fr: {
      title: 'Trakeo ouvre progressivement',
      intro: 'L’app qui te dit combien tu peux dépenser sans risque, avant de dépenser. De nouvelles places s’ouvrent chaque lundi : inscris-toi, tu recevras ton code d’invitation par email quand ce sera ton tour.',
      email: 'Adresse email', ref: 'Code de parrainage (facultatif)',
      consent: 'J’accepte que Trakeo garde mon email uniquement pour m’envoyer mon invitation. Je peux me désinscrire à tout moment.',
      privacy: 'Politique de confidentialité', submit: 'M’inscrire',
      place: 'Ta place dans la file', total: n => `Personnes en attente : ${n}`,
      moveUp: 'Avance dans la file', moveUpBody: 'Chaque ami qui s’inscrit avec ton lien te fait gagner 10 places.',
      referrals: n => `Amis inscrits : ${n}`, copy: 'Copier', copied: 'Copié', share: 'Partager mon lien',
      shareText: 'Je suis sur la liste d’attente de Trakeo, l’app qui dit aux étudiants combien ils peuvent dépenser sans risque. Inscris-toi avec mon lien :',
      invited: 'C’est ton tour ! Ton code d’invitation t’attend dans ta boîte mail.',
      leave: 'Me désinscrire et effacer mon email', leaveConfirm: 'Quitter la liste et effacer ton adresse ?',
      leftDone: 'C’est fait : ton adresse a été effacée de la liste d’attente.',
      footer: 'Trakeo · bêta',
      errors: {
        consent_required: 'Coche la case pour rejoindre la liste.',
        invalid_email: 'Cette adresse email semble incorrecte.',
        disposable_email: 'Les adresses temporaires ne peuvent pas recevoir l’invitation. Utilise ton email habituel.',
        already_joined: 'Cette adresse est déjà sur la liste. Tu recevras ton code par email quand ce sera ton tour.',
        rate_limited: 'Trop d’essais. Réessaie dans une heure.',
        network: 'Pas de connexion. Réessaie dans un instant.',
        generic: 'Une erreur est survenue. Réessaie.',
      },
    },
    en: {
      title: 'Trakeo opens step by step',
      intro: 'The app that tells you how much you can safely spend, before you spend it. New places open every Monday: join the list and we’ll email you your invitation code when it’s your turn.',
      email: 'Email address', ref: 'Referral code (optional)',
      consent: 'I agree that Trakeo keeps my email only to send me my invitation. I can unsubscribe at any time.',
      privacy: 'Privacy policy', submit: 'Join the list',
      place: 'Your place in line', total: n => `People waiting: ${n}`,
      moveUp: 'Move up the line', moveUpBody: 'Each friend who joins with your link moves you up 10 places.',
      referrals: n => `Friends who joined: ${n}`, copy: 'Copy', copied: 'Copied', share: 'Share my link',
      shareText: 'I’m on the waitlist for Trakeo, the app that tells students how much they can safely spend. Join with my link:',
      invited: 'It’s your turn! Your invitation code is in your inbox.',
      leave: 'Unsubscribe and erase my email', leaveConfirm: 'Leave the list and erase your address?',
      leftDone: 'Done: your address has been erased from the waitlist.',
      footer: 'Trakeo · beta',
      errors: {
        consent_required: 'Tick the box to join the list.',
        invalid_email: 'This email address looks incorrect.',
        disposable_email: 'Temporary addresses can’t receive the invitation. Use your usual email.',
        already_joined: 'This address is already on the list. You’ll get your code by email when it’s your turn.',
        rate_limited: 'Too many attempts. Try again in an hour.',
        network: 'No connection. Try again in a moment.',
        generic: 'Something went wrong. Try again.',
      },
    },
  };
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  let lang = params.get('lang') || store.get('trakeo.lang') || ((navigator.language || 'fr').startsWith('fr') ? 'fr' : 'en');
  let info = null;

  async function rpc(name, body) {
    let res;
    try {
      res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: PUBLISHABLE_KEY },
        body: JSON.stringify(body),
      });
    } catch { throw new Error('network'); }
    const data = await res.json().catch(() => null);
    if (!res.ok) throw new Error(data && data.code === 'P0001' ? data.message : 'generic');
    return data;
  }

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.title = `Trakeo · ${lang === 'fr' ? 'Liste d’attente' : 'Waitlist'}`;
    $('lang').textContent = lang === 'fr' ? 'EN' : 'FR';
    document.querySelectorAll('[data-t]').forEach(el => {
      const v = t[el.dataset.t];
      if (typeof v === 'string') el.textContent = v;
    });
    const privacy = lang === 'fr' ? 'privacy.html' : 'privacy-en.html';
    $('privacy').href = privacy;
    $('privacyFooter').href = privacy;
    if (info) {
      $('join').hidden = true;
      $('status').hidden = false;
      $('waiting').hidden = info.invited;
      $('invited').hidden = !info.invited;
      $('rank').textContent = info.rank ? `n° ${info.rank}` : '';
      $('total').textContent = t.total(info.total);
      $('referrals').textContent = info.referrals > 0 ? t.referrals(info.referrals) : '';
      $('mylink').value = `${location.origin}${location.pathname}?ref=${info.referral_code}`;
    }
  }

  function showError(code) {
    const errors = T[lang].errors;
    $('error').textContent = errors[code] || errors.generic;
    $('error').hidden = false;
  }

  $('lang').onclick = () => { lang = lang === 'fr' ? 'en' : 'fr'; store.set('trakeo.lang', lang); render(); };

  $('form').onsubmit = async e => {
    e.preventDefault();
    $('error').hidden = true;
    if (!$('consent').checked) return showError('consent_required');
    $('submit').disabled = true;
    try {
      info = await rpc('access_join_waitlist', {
        p_email: $('email').value.trim(),
        p_locale: lang,
        p_consent: true,
        p_referral: $('ref').value.trim() || null,
      });
      store.set('trakeo.waitlist', info.token);
      render();
    } catch (err) {
      showError(err.message);
    } finally {
      $('submit').disabled = false;
    }
  };

  $('copy').onclick = async () => {
    try { await navigator.clipboard.writeText($('mylink').value); } catch { $('mylink').select(); document.execCommand('copy'); }
    $('copy').textContent = T[lang].copied;
    setTimeout(() => { $('copy').textContent = T[lang].copy; }, 1500);
  };

  $('share').onclick = async () => {
    const text = `${T[lang].shareText} ${$('mylink').value}`;
    if (navigator.share) { try { await navigator.share({ text }); } catch {} }
    else { try { await navigator.clipboard.writeText(text); $('share').textContent = T[lang].copied; } catch {} }
  };

  async function leave(token) {
    try { await rpc('access_leave_waitlist', { p_token: token }); } catch { return showError('network'); }
    store.del('trakeo.waitlist');
    info = null;
    $('join').hidden = true;
    $('status').hidden = true;
    $('left').hidden = false;
  }
  $('leaveBtn').onclick = () => { if (info && confirm(T[lang].leaveConfirm)) leave(info.token); };

  // Entry points: ?ref=CODE (referral link), ?leave=TOKEN (email footer),
  // or a token saved by this browser after joining.
  if (params.get('ref')) $('ref').value = params.get('ref');
  render();
  const leaveToken = params.get('leave');
  if (leaveToken) {
    // Confirm first: mail scanners may open the link on their own.
    if (confirm(T[lang].leaveConfirm)) leave(leaveToken);
  } else {
    const token = store.get('trakeo.waitlist');
    if (token) rpc('access_waitlist_status', { p_token: token }).then(d => { info = d; render(); }).catch(() => store.del('trakeo.waitlist'));
  }
})();
</script>
</body>
</html>
